<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piraten Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🏴‍☠️ Piraten Login</h1>
  <form action="/login" method="post">
    <label for="username">Captain:</label>
    <input type="text" id="username" name="username" autocomplete="username" required><br><br>
    <label for="password">Passwort:</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required><br><br>
    <button type="submit">Segel setzen</button>
  </form>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Schatzkarte</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 20px;
      background: #fdf5e6;
    }
    h1 { margin-bottom: 10px; }
    #map {
      position: relative;
      /* Ensure the card fits headful Playwright viewports while keeping the map ratio */
      width: min(800px, 90vw, calc(70vh * 4 / 3));
      aspect-ratio: 4 / 3;
      margin: 0 auto 20px auto;
      background: url('map.jpg') no-repeat center center;
      background-size: cover;
      border: 4px solid #8b5a2b;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    }
    .island {
      position: absolute;
      transform: translate(-50%, -50%);
      width: var(--button-width, 22%);
      height: var(--button-height, 12%);
      padding: 0;
      border: 3px solid rgba(196, 154, 82, 0.9);
      border-radius: 18px;
      background-color: transparent;
      cursor: pointer;
      user-select: none;
      appearance: none;
      -webkit-appearance: none;
      outline: none;
      transition: box-shadow 0.12s ease, transform 0.12s ease;
    }
    .island:hover,
    .island:focus-visible {
      box-shadow: 0 0 0 4px rgba(255, 248, 220, 0.35);
      transform: translate(-50%, -50%) scale(1.04);
    }
    .island:active {
      transform: translate(-50%, -50%) scale(0.99);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Positionen (anpassbar) */
    #skull { top: 21%; left: 17%; --button-width: 17%; --button-height: 18%; }
    #treasure { top: 55%; left: 52%; --button-width: 20%; --button-height: 14%; }
    #shark { top: 73%; left: 82%; --button-width: 20%; --button-height: 14%; }
    /* Codebeard appears only in bug mode */
    #codebeard {
      top: 58%;
      left: 30%;
      --button-width: 16%;
      --button-height: 16%;
      display: none;
    }
    #codebeard.island--icon {
      background-image: url('pirate_profile_round.png');
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center;
    }

    #result {
      font-size: 1.2rem;
      margin-top: 10px;
      min-height: 1.6em;
    }

    /* Mobile tweak */
    @media (max-width: 600px) {
      #map { width: min(520px, 95vw, calc(65vh * 4 / 3)); }
      .island { border-width: 2px; }
    }
  </style>
</head>
<body>
  <h1>🗺️ Wähle eine Insel</h1>

    <div id="map" aria-label="Schatzkarte">
      <button id="skull" data-testid="skull" class="island" type="button" onclick="explore('skull')" aria-label="Skull Island">
        <span class="sr-only">☠️ Skull Island</span>
      </button>
      <button id="treasure" data-testid="treasure" class="island" type="button" onclick="explore('treasure')" aria-label="Treasure Cove">
        <span class="sr-only">💰 Treasure Cove</span>
      </button>
      <button id="shark" data-testid="shark" class="island" type="button" onclick="explore('shark')" aria-label="Shark Bay">
        <span class="sr-only">🦈 Shark Bay</span>
      </button>
    <!-- Codebeard: shown only in bug mode; has pirate icon and is new treasure location in bug mode -->
      <button id="codebeard" data-testid="codebeard" class="island" type="button" onclick="explore('codebeard')" aria-label="Codebeard">
        <span class="sr-only">🏴‍☠️ Codebeard</span>
      </button>
    </div>

  <h2 id="result" aria-live="polite"></h2>

  <script>
    // Liest 'bug' Query-Parameter (true/false)
    function readBugFlag() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('bug') === 'true';
    }

    const bugMode = readBugFlag();

    // Wenn Bug-Mode aktiv, Codebeard sichtbar machen
    if (bugMode) {
      const cb = document.getElementById('codebeard');
      if (cb) {
        cb.style.display = 'inline-block';
        cb.classList.add('island--icon');
      }
    }

    // explore() behält Logik wie vorher — unterscheidet bugMode
    function explore(place) {
      let msg;
        if (bugMode) {
          // In bug mode: the treasure is at CodeBeard. Shark Bay remains a shark bay.
          if (place === 'codebeard') {
            msg = '🎉 Captn CodeBeard stole the treasure!';
          } else if (place === 'shark') {
            msg = '🦈 Just sharks here.';
          } else if (place === 'skull') {
            msg = '☠️ Only ghosts and old bones...';
          } else {
            msg = '💨 Empty chests – someone was faster!';
          }
        } else {
          // Normal mode: Treasure Cove is the correct island
          if (place === 'treasure') {
            msg = '🎉 You found the treasure!';
          } else if (place === 'skull') {
            msg = '☠️ Only ghosts and old bones...';
          } else {
            msg = '🦈 Just sharks here.';
          }
        }

      // Zeige Ergebnis im Dom
      const out = document.getElementById('result');
      if (out) {
        out.textContent = msg;
      } else {
        alert(msg);
      }
    }

    // Tastatur-Zugänglichkeit für Insel-Buttons
    document.querySelectorAll('.island').forEach(el => {
      if (el.tagName !== 'BUTTON') {
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            el.click();
          }
        });
      }
    });
  </script>
</body>
</html>
